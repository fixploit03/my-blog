---
layout: default
---

<article>
  <p>{{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  <p>by {{ page.author | default: site.author }}</p>

  {{ content }}

  {% if page.tags.size > 0 %}
  <p>tags:
    {% for tag in page.tags %}
      <a href="{{ '/tags/' | append: tag | slugify | relative_url }}/">{{ tag }}</a>{% unless forloop.last %} - {% endunless %}
    {% endfor %}
  </p>
  {% endif %}
</article>
